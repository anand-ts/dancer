<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dancer</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div id="container">
      <canvas id="waveform-canvas"></canvas>
      <div id="controls">
        <div id="audio-controls">
          <audio id="audio-player" controls preload="auto">
            <source src="/Cult Member - Faygo.m4a" type="audio/mp4">
            Your browser does not support the audio element.
          </audio>
          <div id="track-info">♪ Cult Member - Faygo</div>
        </div>
        
        <div id="status"></div>
        <div id="audio-level">
          <div>Audio Level:</div>
          <div id="level-bar">
            <div id="level-fill"></div>
          </div>
          <div id="level-text">0</div>
        </div>
      </div>
    </div>
  </body>
</html>
